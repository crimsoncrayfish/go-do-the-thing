version: '3'

vars:
  MIGRATIONS_PATH: ./src/database/migrations/

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  install:deps:
    desc: "Install all required dependencies for development"
    cmds:
      - echo "Installing Go dependencies..."
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install github.com/air-verse/air@latest
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - echo "Installing Node.js dependencies..."
      - npm install
      - echo "✅ All dependencies installed successfully!"

  setup:env:
    desc: "Create .env file with generated JWT keys (interactive)"
    # NOTE: This task is untested - please verify functionality before relying on it
    silent: true
    cmds:
      - |
        # ANSI color codes
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        CYAN='\033[0;36m'
        WHITE='\033[1;37m'
        NC='\033[0m' # No Color
        
        echo -e "${CYAN}Environment Setup Wizard${NC}"
        echo -e "${CYAN}==========================${NC}"
        echo ""
        echo -e "${WHITE}This will create environment files (.env and .dev.env) with:${NC}"
        echo -e "  ${WHITE}•${NC} Generated JWT authentication keys"
        echo -e "  ${WHITE}•${NC} Local database configuration"
        echo -e "  ${WHITE}•${NC} Development environment settings"
        echo ""
        
        # Check for existing files and get user confirmation
        existing_files=""
        if [ -f .env ]; then
          existing_files="$existing_files.env "
        fi
        if [ -f .dev.env ]; then
          existing_files="$existing_files.dev.env "
        fi
        
        if [ -n "$existing_files" ]; then
          echo -e "${YELLOW}WARNING:${NC} The following files already exist: ${WHITE}$existing_files${NC}"
          echo -e "         ${BLUE}They will be backed up before being replaced.${NC}"
          echo ""
          printf "${WHITE}Do you want to continue? (y/N):${NC} "
          read -r file_confirm
          case "$file_confirm" in
            [yY]|[yY][eE][sS])
              echo -e "${GREEN}SUCCESS:${NC} Proceeding with backup and regeneration..."
              ;;
            *)
              echo -e "${RED}CANCELLED:${NC} Setup cancelled by user."
              exit 0
              ;;
          esac
          echo ""
        fi
        
        # Create backups if files exist
        if [ -f .env ]; then
          backup_name=".env.backup"
          if [ -f "$backup_name" ]; then
            backup_name=".env.backup.$(date +%Y%m%d_%H%M%S)"
          fi
          echo -e "${BLUE}BACKUP:${NC} Backing up .env to ${WHITE}$backup_name${NC}..."
          cp .env "$backup_name"
        fi
        if [ -f .dev.env ]; then
          backup_name=".dev.env.backup"
          if [ -f "$backup_name" ]; then
            backup_name=".dev.env.backup.$(date +%Y%m%d_%H%M%S)"
          fi
          echo -e "${BLUE}BACKUP:${NC} Backing up .dev.env to ${WHITE}$backup_name${NC}..."
          cp .dev.env "$backup_name"
        fi
      - |
        echo -e "${CYAN}JWT Key Generation${NC}"
        echo -e "${CYAN}====================${NC}"
        echo ""
        
        # Create keys directory
        mkdir -p keys
        
        # Determine if we need to generate keys
        generate_keys=false
        
        # Check if keys already exist
        if [ -f keys/private.key ] && [ -f keys/public.key ]; then
          echo -e "${YELLOW}WARNING:${NC} JWT keys already exist in the keys/ directory."
          printf "${WHITE}Do you want to generate new keys? This will overwrite existing ones. (y/N):${NC} "
          read -r key_confirm
          case "$key_confirm" in
            [yY]|[yY][eE][sS])
              echo -e "${GREEN}GENERATING:${NC} Creating new JWT keys..."
              generate_keys=true
              ;;
            *)
              echo -e "${GREEN}USING:${NC} Using existing JWT keys..."
              generate_keys=false
              ;;
          esac
        elif [ -f keys/private.key ] || [ -f keys/public.key ]; then
          echo -e "${YELLOW}WARNING:${NC} Incomplete JWT key set found (missing private or public key)."
          echo -e "${BLUE}INFO:${NC} Will generate a complete new key pair..."
          generate_keys=true
        else
          echo -e "${BLUE}INFO:${NC} No existing JWT keys found. Generating new ones..."
          printf "${WHITE}Continue with key generation? (Y/n):${NC} "
          read -r key_confirm
          case "$key_confirm" in
            [nN]|[nN][oO])
              echo -e "${RED}CANCELLED:${NC} Setup cancelled by user."
              exit 0
              ;;
            *)
              echo -e "${GREEN}PROCEEDING:${NC} Starting key generation..."
              generate_keys=true
              ;;
          esac
        fi
        echo ""
        
        # Generate keys if needed
        if [ "$generate_keys" = true ]; then
          echo -e "${BLUE}GENERATING:${NC} RSA private key (2048 bits)..."
          if ! openssl genpkey -algorithm RSA -out keys/private.key -outform PEM -pkeyopt rsa_keygen_bits:2048; then
            echo -e "${RED}ERROR:${NC} Failed to generate private key"
            exit 1
          fi
          
          echo -e "${BLUE}GENERATING:${NC} Public key from private key..."
          if ! openssl rsa -pubout -in keys/private.key -out keys/public.key; then
            echo -e "${RED}ERROR:${NC} Failed to generate public key"
            exit 1
          fi
        fi
        
        # Validate keys exist
        if [ ! -f keys/private.key ] || [ ! -f keys/public.key ]; then
          echo -e "${RED}ERROR:${NC} Key validation failed - files not found"
          exit 1
        fi
        echo -e "${GREEN}SUCCESS:${NC} JWT keys ready!"
        echo ""
      - |
        echo -e "${CYAN}Environment File Creation${NC}"
        echo -e "${CYAN}============================${NC}"
        echo ""
        echo -e "${WHITE}Creating environment files with:${NC}"
        echo -e "  ${WHITE}•${NC} JWT keys (base64 encoded)"
        echo -e "  ${WHITE}•${NC} Local PostgreSQL database URL"
        echo -e "  ${WHITE}•${NC} Development configuration"
        echo ""
        printf "${WHITE}Proceed with environment file creation? (Y/n):${NC} "
        read -r env_confirm
        case "$env_confirm" in
          [nN]|[nN][oO])
            echo -e "${RED}CANCELLED:${NC} Setup cancelled by user."
            exit 0
            ;;
          *)
            echo -e "${GREEN}CREATING:${NC} Environment files..."
            ;;
        esac
        echo ""
        
        echo -e "${BLUE}ENCODING:${NC} JWT keys to base64..."
        # Cross-platform base64 encoding (works on both macOS and Linux)
        if command -v base64 >/dev/null 2>&1; then
          if base64 --help 2>&1 | grep -q "input-file"; then
            # GNU base64 (Linux)
            JWT_PRIVATE_KEY=$(base64 -w 0 keys/private.key)
            JWT_PUBLIC_KEY=$(base64 -w 0 keys/public.key)
          else
            # BSD base64 (macOS)
            JWT_PRIVATE_KEY=$(base64 -i keys/private.key | tr -d '\n')
            JWT_PUBLIC_KEY=$(base64 -i keys/public.key | tr -d '\n')
          fi
        else
          echo -e "${RED}ERROR:${NC} base64 command not found"
          exit 1
        fi
        
        # Validate base64 encoding worked
        if [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
          echo -e "${RED}ERROR:${NC} Failed to encode keys to base64"
          exit 1
        fi
        echo -e "${GREEN}SUCCESS:${NC} Keys encoded successfully!"
        
        # Validate we have all required components
        if [ ! -f keys/private.key ] || [ ! -f keys/public.key ] || [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
          echo -e "${RED}ERROR:${NC} Missing required components for environment setup"
          exit 1
        fi
        
        # Create main .env file for application
        cat > .env << EOF
        # Go Do The Thing - Environment Configuration
        # Generated on $(date)

        # Application Environment
        # Options: development, production
        ENV=development

        # Server Configuration
        PORT=8080

        # Database Configuration
        DATABASE_URL=postgres://admin:admin@localhost:5432/todo_db?sslmode=disable

        # JWT Authentication Keys (Generated automatically)
        JWT_PRIVATE_KEY=$JWT_PRIVATE_KEY
        JWT_PUBLIC_KEY=$JWT_PUBLIC_KEY

        # Rate Limiting Configuration (optional - defaults to 500 requests per minute)
        RATE_LIMIT_REQUESTS_PER_MINUTE=500

        # Optional: Azure Integration
        # AZURE_CLIENT_ID=<your-azure-client-id>
        EOF
        
        # Create .dev.env file for local migrations (Taskfile expects this)
        cat > .dev.env << EOF
        # Development Environment for Migrations
        # Generated on $(date)
        DATABASE_URL=postgres://admin:admin@localhost:5432/todo_db?sslmode=disable
        EOF
      - |
        echo ""
        echo -e "${GREEN}Environment Setup Complete!${NC}"
        echo -e "${GREEN}==============================${NC}"
        echo ""
        echo -e "${GREEN}SUCCESS:${NC} Files created:"
        echo -e "   ${WHITE}•${NC} .env - Main application environment"
        echo -e "   ${WHITE}•${NC} .dev.env - Migration environment"
        echo -e "   ${WHITE}•${NC} keys/private.key - JWT private key"
        echo -e "   ${WHITE}•${NC} keys/public.key - JWT public key"
        echo ""
        echo -e "${CYAN}Next steps:${NC}"
        echo -e "   ${WHITE}1.${NC} Start the database: ${YELLOW}docker compose -f docker-compose-db-local.yml up -d${NC}"
        echo -e "   ${WHITE}2.${NC} Run migrations: ${YELLOW}task local:migrate -- up${NC}"
        echo -e "   ${WHITE}3.${NC} Start the app: ${YELLOW}air${NC}"
        echo ""
        echo -e "${BLUE}INFO:${NC} Your environment is ready for development!"

  setup:env:auto:
    desc: "Create .env files automatically (non-interactive, for CI/automation)"
    # NOTE: This task is untested - please verify functionality before relying on it
    silent: true
    cmds:
      - |
        # ANSI color codes
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        CYAN='\033[0;36m'
        WHITE='\033[1;37m'
        NC='\033[0m' # No Color
        
        echo -e "${CYAN}Automated Environment Setup${NC}"
        echo -e "${CYAN}==============================${NC}"
        echo ""
        
        # Create backups if files exist
        if [ -f .env ]; then
          backup_name=".env.backup.$(date +%Y%m%d_%H%M%S)"
          echo -e "${BLUE}BACKUP:${NC} Backing up .env to ${WHITE}$backup_name${NC}..."
          cp .env "$backup_name"
        fi
        if [ -f .dev.env ]; then
          backup_name=".dev.env.backup.$(date +%Y%m%d_%H%M%S)"
          echo -e "${BLUE}BACKUP:${NC} Backing up .dev.env to ${WHITE}$backup_name${NC}..."
          cp .dev.env "$backup_name"
        fi
        
        # Create keys directory and generate keys
        mkdir -p keys
        echo -e "${BLUE}GENERATING:${NC} JWT keys..."
        if ! openssl genpkey -algorithm RSA -out keys/private.key -outform PEM -pkeyopt rsa_keygen_bits:2048; then
          echo -e "${RED}ERROR:${NC} Failed to generate private key"
          exit 1
        fi
        if ! openssl rsa -pubout -in keys/private.key -out keys/public.key; then
          echo -e "${RED}ERROR:${NC} Failed to generate public key"
          exit 1
        fi
        
        # Encode keys
        echo -e "${BLUE}ENCODING:${NC} Keys to base64..."
        if base64 --help 2>&1 | grep -q "input-file"; then
          JWT_PRIVATE_KEY=$(base64 -w 0 keys/private.key)
          JWT_PUBLIC_KEY=$(base64 -w 0 keys/public.key)
        else
          JWT_PRIVATE_KEY=$(base64 -i keys/private.key | tr -d '\n')
          JWT_PUBLIC_KEY=$(base64 -i keys/public.key | tr -d '\n')
        fi
        
        # Validate encoding
        if [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
          echo -e "${RED}ERROR:${NC} Failed to encode keys to base64"
          exit 1
        fi
        
        # Create .env file
        echo -e "${BLUE}CREATING:${NC} .env file..."
        cat > .env << EOF
        # Go Do The Thing - Environment Configuration
        # Generated automatically on $(date)

        # Application Environment
        ENV=development

        # Server Configuration
        PORT=8080

        # Database Configuration
        DATABASE_URL=postgres://admin:admin@localhost:5432/todo_db?sslmode=disable

        # JWT Authentication Keys (Generated automatically)
        JWT_PRIVATE_KEY=$JWT_PRIVATE_KEY
        JWT_PUBLIC_KEY=$JWT_PUBLIC_KEY

        # Rate Limiting Configuration (optional - defaults to 500 requests per minute)
        RATE_LIMIT_REQUESTS_PER_MINUTE=500

        # Optional: Azure Integration
        # AZURE_CLIENT_ID=<your-azure-client-id>
        EOF
        
        # Create .dev.env file
        echo -e "${BLUE}CREATING:${NC} .dev.env file..."
        cat > .dev.env << EOF
        # Development Environment for Migrations
        # Generated automatically on $(date)
        DATABASE_URL=postgres://admin:admin@localhost:5432/todo_db?sslmode=disable
        EOF
        
        echo -e "${GREEN}SUCCESS:${NC} Automated setup complete!"

  setup:env:check:
    desc: "Create .env files only if they don't exist (safe mode)"
    # NOTE: This task is untested - please verify functionality before relying on it
    silent: true
    cmds:
      - |
        # ANSI color codes
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        CYAN='\033[0;36m'
        WHITE='\033[1;37m'
        NC='\033[0m' # No Color
        
        if [ -f .env ] && [ -f .dev.env ]; then
          echo -e "${GREEN}SUCCESS:${NC} Environment files already exist:"
          echo -e "   ${WHITE}•${NC} .env"
          echo -e "   ${WHITE}•${NC} .dev.env"
          echo ""
          echo -e "${BLUE}INFO:${NC} Use ${YELLOW}'task setup:env'${NC} to regenerate (interactive)"
          echo -e "${BLUE}INFO:${NC} Use ${YELLOW}'task setup:env:auto'${NC} for non-interactive regeneration"
          exit 0
        fi
      - task: setup:env:auto

  setup:verify:
    desc: "Verify environment setup is complete and valid"
    silent: true
    cmds:
      - |
        # ANSI color codes
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        CYAN='\033[0;36m'
        WHITE='\033[1;37m'
        NC='\033[0m' # No Color
        
        echo -e "${CYAN}Environment Verification${NC}"
        echo -e "${CYAN}=======================${NC}"
        echo ""
        
        errors=0
        
        # Check .env file
        if [ -f .env ]; then
          echo -e "${GREEN}SUCCESS:${NC} .env file exists"
          if grep -q "JWT_PRIVATE_KEY=" .env && grep -q "JWT_PUBLIC_KEY=" .env && grep -q "DATABASE_URL=" .env; then
            echo -e "${GREEN}SUCCESS:${NC} .env contains required variables"
          else
            echo -e "${RED}ERROR:${NC} .env missing required variables"
            errors=$((errors + 1))
          fi
        else
          echo -e "${RED}ERROR:${NC} .env file not found"
          errors=$((errors + 1))
        fi
        
        # Check .dev.env file
        if [ -f .dev.env ]; then
          echo -e "${GREEN}SUCCESS:${NC} .dev.env file exists"
          if grep -q "DATABASE_URL=" .dev.env; then
            echo -e "${GREEN}SUCCESS:${NC} .dev.env contains DATABASE_URL"
          else
            echo -e "${RED}ERROR:${NC} .dev.env missing DATABASE_URL"
            errors=$((errors + 1))
          fi
        else
          echo -e "${RED}ERROR:${NC} .dev.env file not found"
          errors=$((errors + 1))
        fi
        
        # Check JWT keys
        if [ -f keys/private.key ] && [ -f keys/public.key ]; then
          echo -e "${GREEN}SUCCESS:${NC} JWT key files exist"
        else
          echo -e "${RED}ERROR:${NC} JWT key files missing"
          errors=$((errors + 1))
        fi
        
        echo ""
        if [ $errors -eq 0 ]; then
          echo -e "${GREEN}VERIFICATION PASSED:${NC} Environment setup is complete and valid!"
          echo -e "${BLUE}INFO:${NC} Ready to start development"
        else
          echo -e "${RED}VERIFICATION FAILED:${NC} Found $errors error(s)"
          echo -e "${YELLOW}SUGGESTION:${NC} Run 'task setup:env' to fix issues"
          exit 1
        fi

  setup:init:
    desc: "Complete project initialization (dependencies + environment)"
    cmds:
      - task: install:deps
      - task: setup:env
      - task: setup:verify

  _confirm:prod:
    internal: true
    cmds:
      - |
        #!/bin/sh
        printf "⚠️  WARNING: You are about to run a migration on the PRODUCTION database.\n"
        printf "Are you absolutely sure you want to continue? (y/N): "
        IFS= read -r confirm
        case "$confirm" in
          *$'\r') confirm=${confirm%$'\r'} ;;
        esac
        if [ "$confirm" = "y" ]; then
          printf "Confirmation received. Proceeding...\n"
        else
          printf "Migration cancelled by user.\n"
          exit 1
        fi
    silent: true

  local:migrate:
    desc: "Runs migrations on LOCAL db (e.g., `task local:migrate up`)"
    dotenv: [".dev.env"]
    cmds:
      - echo "Running LOCAL migration '$DATABASE_URL'..."
      - migrate -path {{.MIGRATIONS_PATH}} -database $DATABASE_URL {{.CLI_ARGS}}

  local:migrate:goto:
    desc: "Migrates LOCAL db to a specific version (e.g., `task local:migrate:goto V=...`)"
    dotenv: [".dev.env"]
    preconditions:
      - sh: 'test -n "{{.V}}"'
        msg: "You must provide a version number. Usage: task local:migrate:goto V=2025..."
    cmds:
      - echo "Running LOCAL migration to version {{.V}}..."
      - migrate -path {{.MIGRATIONS_PATH}} -database $DATABASE_URL goto {{.V}}

  prod:migrate:
    desc: "Runs migrations on PRODUCTION db (e.g., `task prod:migrate up`)"
    dotenv: [".prod.env"]
    cmds:
      - task: _confirm:prod
      - migrate -path {{.MIGRATIONS_PATH}} -database $DATABASE_URL {{.CLI_ARGS}}

  prod:migrate:goto:
    desc: "Migrates PRODUCTION db to a specific version (e.g., `task prod:migrate:goto V=...`)"
    dotenv: [".prod.env"]
    preconditions:
      - sh: 'test -n "{{.V}}"'
        msg: "You must provide a version number. Usage: task prod:migrate:goto V=2025..."
    cmds:
      - task: _confirm:prod
      - echo "Running PRODUCTION migration to version {{.V}}..."
      #- migrate -path {{.MIGRATIONS_PATH}} -database $DATABASE_URL goto {{.V}}
