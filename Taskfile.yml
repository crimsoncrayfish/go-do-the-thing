version: '3'

vars:
  MIGRATIONS_PATH: ./src/database/migrations/

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  install:deps:
    desc: "Install all required dependencies for development"
    cmds:
      - echo "Installing Go dependencies..."
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install github.com/air-verse/air@latest
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - echo "Installing Node.js dependencies..."
      - npm install
      - echo "✅ All dependencies installed successfully!"

  _confirm:prod:
    internal: true
    cmds:
      - |
        #!/bin/sh
        printf "⚠️  WARNING: You are about to run a migration on the PRODUCTION database.\n"
        printf "Are you absolutely sure you want to continue? (y/N): "
        IFS= read -r confirm
        case "$confirm" in
          *$'\r') confirm=${confirm%$'\r'} ;;
        esac
        if [ "$confirm" = "y" ]; then
          printf "Confirmation received. Proceeding...\n"
        else
          printf "Migration cancelled by user.\n"
          exit 1
        fi
    silent: true

  local:migrate:
    desc: "Runs migrations on LOCAL db (e.g., `task local:migrate up`)"
    dotenv: [".dev.env"]
    cmds:
      - echo "Running LOCAL migration '$DATABASE_URL'..."
      - migrate -path {{.MIGRATIONS_PATH}} -database $DATABASE_URL {{.CLI_ARGS}}

  local:migrate:goto:
    desc: "Migrates LOCAL db to a specific version (e.g., `task local:migrate:goto V=...`)"
    dotenv: [".dev.env"]
    preconditions:
      - sh: 'test -n "{{.V}}"'
        msg: "You must provide a version number. Usage: task local:migrate:goto V=2025..."
    cmds:
      - echo "Running LOCAL migration to version {{.V}}..."
      - migrate -path {{.MIGRATIONS_PATH}} -database $DATABASE_URL goto {{.V}}

  prod:migrate:
    desc: "Runs migrations on PRODUCTION db (e.g., `task prod:migrate up`)"
    dotenv: [".prod.env"]
    cmds:
      - task: _confirm:prod
      - migrate -path {{.MIGRATIONS_PATH}} -database $DATABASE_URL {{.CLI_ARGS}}

  prod:migrate:goto:
    desc: "Migrates PRODUCTION db to a specific version (e.g., `task prod:migrate:goto V=...`)"
    dotenv: [".prod.env"]
    preconditions:
      - sh: 'test -n "{{.V}}"'
        msg: "You must provide a version number. Usage: task prod:migrate:goto V=2025..."
    cmds:
      - task: _confirm:prod
      - echo "Running PRODUCTION migration to version {{.V}}..."
      #- migrate -path {{.MIGRATIONS_PATH}} -database $DATABASE_URL goto {{.V}}
