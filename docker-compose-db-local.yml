services:
  db:
    image: postgres:17
    container_name: todo_db
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: admin 
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations_runner:
    image: migrate/migrate
    container_name: todo_db_migration_runner
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/database/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://admin:admin@db:5432/todo_db?sslmode=disable",
        "up",
      ]
    restart: "no"

volumes:
  pgdata:
