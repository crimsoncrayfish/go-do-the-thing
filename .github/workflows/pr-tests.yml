name: PR Unit Tests

on:
  pull_request:
    branches: [ "master" ]

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        id: test_results
        run: |
          # Run all tests and capture output (don't exit on failure yet)
          set +e
          go test -v -coverprofile=coverage.out ./... > test-results.txt 2>&1
          test_exit_code=$?
          set -e
          
          # Parse test results
          if grep -q "FAIL" test-results.txt; then
            echo "tests_failed=true" >> $GITHUB_OUTPUT
            failed_count=$(grep -c "FAIL:" test-results.txt || echo "0")
            echo "failed_count=$failed_count" >> $GITHUB_OUTPUT
          else
            echo "tests_failed=false" >> $GITHUB_OUTPUT
            echo "failed_count=0" >> $GITHUB_OUTPUT
          fi
          
          # Count passed tests
          passed_count=$(grep -c "PASS:" test-results.txt || echo "0")
          echo "passed_count=$passed_count" >> $GITHUB_OUTPUT
          
          # Calculate total
          total_count=$((passed_count + $(echo "${failed_count:-0}")))
          echo "total_count=$total_count" >> $GITHUB_OUTPUT
          
          # Get coverage percentage
          if [ -f coverage.out ]; then
            coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
            echo "coverage=$coverage" >> $GITHUB_OUTPUT
          else
            echo "coverage=0%" >> $GITHUB_OUTPUT
          fi
          
          # Store full test output for comment
          cat test-results.txt
          
          # Exit with the original test exit code
          exit $test_exit_code
          passed_count=$(grep -c "PASS:" test-results.txt || echo "0")
          echo "passed_count=$passed_count" >> $GITHUB_OUTPUT
          total_count=$((passed_count + $(echo "${failed_count:-0}")))
          echo "total_count=$total_count" >> $GITHUB_OUTPUT
          if [ -f coverage.out ]; then
            coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
            echo "coverage=$coverage" >> $GITHUB_OUTPUT
          else
            echo "coverage=0%" >> $GITHUB_OUTPUT
          fi
          cat test-results.txt
          if [ "${{ steps.test_results.outputs.tests_failed }}" = "true" ]; then
            exit 1
          fi

      - name: Generate test summary
        id: test_summary
        if: always()
        run: |
          if [ "${{ steps.test_results.outputs.tests_failed }}" = "true" ]; then
            status="❌ **FAILED**"
            summary="**Unit Test Results - FAILED** ❌\\n\\n"
          else
            status="✅ **PASSED**"
            summary="**Unit Test Results - PASSED** ✅\\n\\n"
          fi
          summary+="📊 **Test Summary:**\\n"
          summary+="- Total Tests: ${{ steps.test_results.outputs.total_count }}\\n"
          summary+="- Passed: ${{ steps.test_results.outputs.passed_count }} ✅\\n"
          summary+="- Failed: ${{ steps.test_results.outputs.failed_count }} ❌\\n"
          summary+="- Coverage: ${{ steps.test_results.outputs.coverage }}\\n\\n"
          if [ "${{ steps.test_results.outputs.tests_failed }}" = "true" ]; then
            summary+="🚨 **Action Required:** Please fix the failing tests before merging.\\n\\n"
            summary+="<details>\\n<summary>View Test Output</summary>\\n\\n\`\`\`\\n"
            summary+="$(cat test-results.txt | head -50)"
            summary+="\\n\`\`\`\\n</details>"
          else
            summary+="🎉 All tests are passing! Ready for review."
          fi
          echo "test_summary<<EOF" >> $GITHUB_OUTPUT
          echo -e "$summary" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post test results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const testSummary = `${{ steps.test_summary.outputs.test_summary }}`;
            // Check if we already posted a comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Unit Test Results')
            );
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: testSummary
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: testSummary
              });
            }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.txt
            coverage.out

      - name: Block PR if tests fail
        if: steps.test_results.outputs.tests_failed == 'true'
        run: |
          echo "❌ Tests failed. Blocking PR merge."
          exit 1
